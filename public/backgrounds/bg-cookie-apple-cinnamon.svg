<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    
    <radialGradient id="bg-base-cookie-apple-cinnamon" cx="50%" cy="45%" r="75%">
      <stop offset="0%" stop-color="#FAF5EE" />
      <stop offset="45%" stop-color="#F6E4D0" />
      <stop offset="80%" stop-color="#ECC6A7" />
      <stop offset="100%" stop-color="#E0A77E" />
    </radialGradient>
    <linearGradient id="apple-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D32F2F" stop-opacity="0.65" />
      <stop offset="100%" stop-color="#A52A2A" stop-opacity="0.4" />
    </linearGradient>
    <linearGradient id="cinnamon-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B26A3B" stop-opacity="0.65" />
      <stop offset="100%" stop-color="#795548" stop-opacity="0.45" />
    </linearGradient>
    <filter id="soft-blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="35" result="blur" />
    </filter>
    <filter id="deep-blur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="65" result="deepBlur" />
    </filter>
    <filter id="gentle-blur" x="-15%" y="-15%" width="130%" height="130%">
      <feGaussianBlur stdDeviation="20" result="gentleBlur" />
    </filter>
    
    <radialGradient id="center-highlight" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.32" />
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="dark-center-highlight" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.15" />
      <stop offset="65%" stop-color="#ffffff" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Base Ambient Scene Fill -->
  <rect width="1920" height="1080" fill="url(#bg-base-cookie-apple-cinnamon)" />

  <!-- Natural Ingredients Behind Glass Layer -->
  <g id="ingredient-elements">
    
      <!-- Soft blurred orchard apples -->
      <circle cx="280" cy="270" r="170" fill="url(#apple-grad)" filter="url(#deep-blur)" />
      <circle cx="360" cy="340" r="120" fill="#FFAB91" opacity="0.55" filter="url(#soft-blur)" />
      <circle cx="1660" cy="750" r="200" fill="url(#apple-grad)" filter="url(#deep-blur)" />
      <circle cx="1580" cy="830" r="140" fill="url(#apple-grad)" filter="url(#deep-blur)" />
      <!-- Cinnamon bark sticks & apple blossom leaves -->
      <rect x="140" y="560" width="140" height="340" rx="40" transform="rotate(35 140 560)" fill="url(#cinnamon-grad)" filter="url(#deep-blur)" />
      <rect x="1680" y="160" width="130" height="300" rx="35" transform="rotate(-30 1680 160)" fill="url(#cinnamon-grad)" filter="url(#deep-blur)" />
      <path d="M 460,180 C 560,100 660,180 620,280 C 560,370 410,280 460,180 Z" fill="#FFCC80" opacity="0.6" filter="url(#deep-blur)" />
      <circle cx="1380" cy="880" r="120" fill="url(#cinnamon-grad)" filter="url(#deep-blur)" />
  </g>

  <!-- Center Product Halo Spotlight -->
  <rect width="1920" height="1080" fill="url(#center-highlight)" />

  <!-- Frosted Glass Matte Diffuse Veil -->
  
      <rect width="1920" height="1080" fill="#FAF5ED" opacity="0.45" />
      <radialGradient id="vignette-apple-cinnamon" cx="50%" cy="50%" r="70%">
        <stop offset="40%" stop-color="#000000" stop-opacity="0" />
        <stop offset="100%" stop-color="#C55333" stop-opacity="0.10" />
      </radialGradient>
      <rect width="1920" height="1080" fill="url(#vignette-apple-cinnamon)" />
</svg>