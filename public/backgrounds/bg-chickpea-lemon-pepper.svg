<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    
    <radialGradient id="bg-base-chickpea-lemon-pepper" cx="50%" cy="45%" r="75%">
      <stop offset="0%" stop-color="#FCFDF7" />
      <stop offset="45%" stop-color="#F8FAEB" />
      <stop offset="80%" stop-color="#EFF5D5" />
      <stop offset="100%" stop-color="#E2ECC0" />
    </radialGradient>
    <linearGradient id="citrus-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFEE58" stop-opacity="0.65" />
      <stop offset="100%" stop-color="#C0CA33" stop-opacity="0.4" />
    </linearGradient>
    <linearGradient id="pepper-mist" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9E9D24" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#556B2F" stop-opacity="0.25" />
    </linearGradient>
    <filter id="soft-blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="35" result="blur" />
    </filter>
    <filter id="deep-blur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="65" result="deepBlur" />
    </filter>
    <filter id="gentle-blur" x="-15%" y="-15%" width="130%" height="130%">
      <feGaussianBlur stdDeviation="20" result="gentleBlur" />
    </filter>
    
    <radialGradient id="center-highlight" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.32" />
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="dark-center-highlight" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.15" />
      <stop offset="65%" stop-color="#ffffff" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Base Ambient Scene Fill -->
  <rect width="1920" height="1080" fill="url(#bg-base-chickpea-lemon-pepper)" />

  <!-- Natural Ingredients Behind Glass Layer -->
  <g id="ingredient-elements">
    
      <!-- Soft diffuse lemon discs & citrus slices -->
      <circle cx="280" cy="260" r="160" fill="url(#citrus-grad)" filter="url(#deep-blur)" />
      <circle cx="360" cy="320" r="110" fill="#FFF9C4" opacity="0.65" filter="url(#soft-blur)" />
      <circle cx="1660" cy="760" r="190" fill="url(#citrus-grad)" filter="url(#deep-blur)" />
      <circle cx="1560" cy="840" r="130" fill="#F0F4C3" opacity="0.6" filter="url(#deep-blur)" />
      <!-- Subtle citrus foliage & pepper curves -->
      <path d="M 160,540 C 240,420 380,500 340,640 C 290,770 100,680 160,540 Z" fill="url(#pepper-mist)" filter="url(#deep-blur)" />
      <path d="M 1720,240 C 1600,160 1780,80 1860,180 C 1930,270 1820,360 1720,240 Z" fill="url(#citrus-grad)" filter="url(#deep-blur)" />
      <circle cx="560" cy="180" r="90" fill="url(#citrus-grad)" filter="url(#deep-blur)" />
      <circle cx="1380" cy="880" r="110" fill="url(#citrus-grad)" filter="url(#deep-blur)" />
  </g>

  <!-- Center Product Halo Spotlight -->
  <rect width="1920" height="1080" fill="url(#center-highlight)" />

  <!-- Frosted Glass Matte Diffuse Veil -->
  
      <rect width="1920" height="1080" fill="#FAFBF7" opacity="0.48" />
      <radialGradient id="vignette-lemon-pepper" cx="50%" cy="50%" r="70%">
        <stop offset="40%" stop-color="#000000" stop-opacity="0" />
        <stop offset="100%" stop-color="#D4AC0D" stop-opacity="0.07" />
      </radialGradient>
      <rect width="1920" height="1080" fill="url(#vignette-lemon-pepper)" />
</svg>