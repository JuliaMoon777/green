<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    
    <radialGradient id="bg-base-sweet-herbs-olives" cx="50%" cy="45%" r="75%">
      <stop offset="0%" stop-color="#F2F8F8" />
      <stop offset="45%" stop-color="#E2EFEF" />
      <stop offset="80%" stop-color="#C9E1E2" />
      <stop offset="100%" stop-color="#ADCED0" />
    </radialGradient>
    <linearGradient id="olive-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#33691E" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#1B3810" stop-opacity="0.45" />
    </linearGradient>
    <linearGradient id="herb-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#558B2F" stop-opacity="0.55" />
      <stop offset="100%" stop-color="#2E6266" stop-opacity="0.4" />
    </linearGradient>
    <filter id="soft-blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="35" result="blur" />
    </filter>
    <filter id="deep-blur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="65" result="deepBlur" />
    </filter>
    <filter id="gentle-blur" x="-15%" y="-15%" width="130%" height="130%">
      <feGaussianBlur stdDeviation="20" result="gentleBlur" />
    </filter>
    
    <radialGradient id="center-highlight" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.32" />
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="dark-center-highlight" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.15" />
      <stop offset="65%" stop-color="#ffffff" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Base Ambient Scene Fill -->
  <rect width="1920" height="1080" fill="url(#bg-base-sweet-herbs-olives)" />

  <!-- Natural Ingredients Behind Glass Layer -->
  <g id="ingredient-elements">
    
      <!-- Soft blurred olive fruits -->
      <ellipse cx="280" cy="300" rx="90" ry="130" transform="rotate(-30 280 300)" fill="url(#olive-grad)" filter="url(#deep-blur)" />
      <ellipse cx="380" cy="240" rx="80" ry="120" transform="rotate(20 380 240)" fill="url(#olive-grad)" filter="url(#deep-blur)" />
      <ellipse cx="1640" cy="740" rx="100" ry="145" transform="rotate(40 1640 740)" fill="url(#olive-grad)" filter="url(#deep-blur)" />
      <ellipse cx="1540" cy="830" rx="85" ry="125" transform="rotate(-15 1540 830)" fill="url(#olive-grad)" filter="url(#deep-blur)" />
      <!-- Olive branch & rosemary herb sprigs -->
      <path d="M 120,540 C 260,420 440,560 380,720 C 310,870 110,750 120,540 Z" fill="url(#herb-grad)" filter="url(#deep-blur)" />
      <path d="M 1720,280 C 1580,200 1780,100 1860,220 C 1920,330 1820,440 1720,280 Z" fill="url(#herb-grad)" filter="url(#deep-blur)" />
      <path d="M 480,180 C 560,110 660,180 620,270 C 580,350 420,270 480,180 Z" fill="url(#herb-grad)" filter="url(#soft-blur)" />
      <path d="M 1420,860 C 1340,780 1460,700 1550,760 C 1630,830 1510,950 1420,860 Z" fill="url(#herb-grad)" filter="url(#soft-blur)" />
  </g>

  <!-- Center Product Halo Spotlight -->
  <rect width="1920" height="1080" fill="url(#center-highlight)" />

  <!-- Frosted Glass Matte Diffuse Veil -->
  
      <rect width="1920" height="1080" fill="#F4FAFA" opacity="0.46" />
      <radialGradient id="vignette-herbs-olives" cx="50%" cy="50%" r="70%">
        <stop offset="40%" stop-color="#000000" stop-opacity="0" />
        <stop offset="100%" stop-color="#2B8FA3" stop-opacity="0.08" />
      </radialGradient>
      <rect width="1920" height="1080" fill="url(#vignette-herbs-olives)" />
</svg>