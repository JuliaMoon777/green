<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    
    <radialGradient id="bg-base-cookie-double-chocolate" cx="50%" cy="45%" r="75%">
      <stop offset="0%" stop-color="#FAF4EE" />
      <stop offset="45%" stop-color="#EFE0D3" />
      <stop offset="80%" stop-color="#DFC4B0" />
      <stop offset="100%" stop-color="#CFA78F" />
    </radialGradient>
    <linearGradient id="choc-deep-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4E2B1E" stop-opacity="0.65" />
      <stop offset="100%" stop-color="#2D150B" stop-opacity="0.45" />
    </linearGradient>
    <linearGradient id="cocoa-warm-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#794B34" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#4E2B1E" stop-opacity="0.35" />
    </linearGradient>
    <filter id="soft-blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="35" result="blur" />
    </filter>
    <filter id="deep-blur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="65" result="deepBlur" />
    </filter>
    <filter id="gentle-blur" x="-15%" y="-15%" width="130%" height="130%">
      <feGaussianBlur stdDeviation="20" result="gentleBlur" />
    </filter>
    
    <radialGradient id="center-highlight" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.32" />
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="dark-center-highlight" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.15" />
      <stop offset="65%" stop-color="#ffffff" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Base Ambient Scene Fill -->
  <rect width="1920" height="1080" fill="url(#bg-base-cookie-double-chocolate)" />

  <!-- Natural Ingredients Behind Glass Layer -->
  <g id="ingredient-elements">
    
      <!-- Soft blurred cocoa pods & chocolate waves -->
      <ellipse cx="280" cy="280" rx="140" ry="200" transform="rotate(-35 280 280)" fill="url(#choc-deep-grad)" filter="url(#deep-blur)" />
      <circle cx="340" cy="350" r="110" fill="url(#cocoa-warm-grad)" filter="url(#soft-blur)" />
      <ellipse cx="1660" cy="740" rx="160" ry="230" transform="rotate(30 1660 740)" fill="url(#choc-deep-grad)" filter="url(#deep-blur)" />
      <circle cx="1560" cy="820" r="130" fill="url(#cocoa-warm-grad)" filter="url(#soft-blur)" />
      <!-- Flowing chocolate ribbons -->
      <path d="M 120,620 C 300,500 460,660 380,820 C 300,960 100,840 120,620 Z" fill="url(#cocoa-warm-grad)" filter="url(#deep-blur)" />
      <path d="M 1740,240 C 1600,160 1780,60 1880,160 C 1960,260 1840,360 1740,240 Z" fill="url(#cocoa-warm-grad)" filter="url(#deep-blur)" />
      <circle cx="600" cy="180" r="110" fill="url(#cocoa-warm-grad)" filter="url(#deep-blur)" />
      <circle cx="1360" cy="880" r="120" fill="url(#choc-deep-grad)" filter="url(#deep-blur)" />
  </g>

  <!-- Center Product Halo Spotlight -->
  <rect width="1920" height="1080" fill="url(#center-highlight)" />

  <!-- Frosted Glass Matte Diffuse Veil -->
  
      <rect width="1920" height="1080" fill="#F8F3ED" opacity="0.46" />
      <radialGradient id="vignette-chocolate" cx="50%" cy="50%" r="70%">
        <stop offset="40%" stop-color="#000000" stop-opacity="0" />
        <stop offset="100%" stop-color="#3A1E14" stop-opacity="0.12" />
      </radialGradient>
      <rect width="1920" height="1080" fill="url(#vignette-chocolate)" />
</svg>