<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    
    <radialGradient id="bg-base-cookie-display-box" cx="50%" cy="45%" r="75%">
      <stop offset="0%" stop-color="#FAF5EF" />
      <stop offset="45%" stop-color="#F2E4D4" />
      <stop offset="80%" stop-color="#E5CCB5" />
      <stop offset="100%" stop-color="#D4B094" />
    </radialGradient>
    <linearGradient id="box-warm-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D7CCC8" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#8D6E63" stop-opacity="0.35" />
    </linearGradient>
    <linearGradient id="box-amber-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFCA28" stop-opacity="0.55" />
      <stop offset="100%" stop-color="#A1887F" stop-opacity="0.35" />
    </linearGradient>
    <filter id="soft-blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="35" result="blur" />
    </filter>
    <filter id="deep-blur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="65" result="deepBlur" />
    </filter>
    <filter id="gentle-blur" x="-15%" y="-15%" width="130%" height="130%">
      <feGaussianBlur stdDeviation="20" result="gentleBlur" />
    </filter>
    
    <radialGradient id="center-highlight" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.32" />
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="dark-center-highlight" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.15" />
      <stop offset="65%" stop-color="#ffffff" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Base Ambient Scene Fill -->
  <rect width="1920" height="1080" fill="url(#bg-base-cookie-display-box)" />

  <!-- Natural Ingredients Behind Glass Layer -->
  <g id="ingredient-elements">
    
      <!-- Harmonized cookies mix: cocoa, apple, golden butter -->
      <circle cx="280" cy="260" r="160" fill="url(#box-warm-grad)" filter="url(#deep-blur)" />
      <circle cx="360" cy="340" r="120" fill="#FFE082" opacity="0.6" filter="url(#soft-blur)" />
      <circle cx="1660" cy="750" r="200" fill="url(#box-warm-grad)" filter="url(#deep-blur)" />
      <circle cx="1560" cy="830" r="130" fill="url(#box-amber-grad)" filter="url(#deep-blur)" />
      <path d="M 160,560 C 260,460 400,560 340,720 C 270,860 100,720 160,560 Z" fill="url(#box-amber-grad)" filter="url(#deep-blur)" />
      <path d="M 1740,240 C 1600,160 1780,60 1880,160 C 1960,260 1840,360 1740,240 Z" fill="url(#box-warm-grad)" filter="url(#deep-blur)" />
      <circle cx="600" cy="180" r="100" fill="#FFE082" opacity="0.5" filter="url(#deep-blur)" />
      <circle cx="1360" cy="880" r="110" fill="url(#box-warm-grad)" filter="url(#deep-blur)" />
  </g>

  <!-- Center Product Halo Spotlight -->
  <rect width="1920" height="1080" fill="url(#center-highlight)" />

  <!-- Frosted Glass Matte Diffuse Veil -->
  
      <rect width="1920" height="1080" fill="#F8F3ED" opacity="0.46" />
      <radialGradient id="vignette-display-box" cx="50%" cy="50%" r="70%">
        <stop offset="40%" stop-color="#000000" stop-opacity="0" />
        <stop offset="100%" stop-color="#4A3B32" stop-opacity="0.10" />
      </radialGradient>
      <rect width="1920" height="1080" fill="url(#vignette-display-box)" />
</svg>