<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    
    <radialGradient id="bg-base-chili-lemon" cx="50%" cy="45%" r="75%">
      <stop offset="0%" stop-color="#FBF7EC" />
      <stop offset="45%" stop-color="#F5ECCF" />
      <stop offset="80%" stop-color="#EADBBA" />
      <stop offset="100%" stop-color="#DECBA3" />
    </radialGradient>
    <linearGradient id="lemon-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE866" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#E6B800" stop-opacity="0.5" />
    </linearGradient>
    <linearGradient id="chili-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E6392E" stop-opacity="0.65" />
      <stop offset="100%" stop-color="#B81D13" stop-opacity="0.4" />
    </linearGradient>
    <linearGradient id="leaf-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8BB655" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#558B2F" stop-opacity="0.35" />
    </linearGradient>
    <filter id="soft-blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="35" result="blur" />
    </filter>
    <filter id="deep-blur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="65" result="deepBlur" />
    </filter>
    <filter id="gentle-blur" x="-15%" y="-15%" width="130%" height="130%">
      <feGaussianBlur stdDeviation="20" result="gentleBlur" />
    </filter>
    
    <radialGradient id="center-highlight" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.32" />
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="dark-center-highlight" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.15" />
      <stop offset="65%" stop-color="#ffffff" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Base Ambient Scene Fill -->
  <rect width="1920" height="1080" fill="url(#bg-base-chili-lemon)" />

  <!-- Natural Ingredients Behind Glass Layer -->
  <g id="ingredient-elements">
    
      <!-- Soft blurred lemons on top left and bottom right -->
      <circle cx="280" cy="240" r="170" fill="url(#lemon-grad)" filter="url(#deep-blur)" />
      <circle cx="310" cy="220" r="120" fill="#FFEAA7" opacity="0.6" filter="url(#soft-blur)" />
      <circle cx="1680" cy="780" r="210" fill="url(#lemon-grad)" filter="url(#deep-blur)" />
      <circle cx="1720" cy="750" r="140" fill="#FFF3CD" opacity="0.7" filter="url(#soft-blur)" />
      <!-- Lemon foliage / botanical leaves -->
      <path d="M 180,480 C 130,380 260,330 360,390 C 460,450 330,580 180,480 Z" fill="url(#leaf-grad)" filter="url(#deep-blur)" />
      <path d="M 1520,320 C 1440,240 1560,180 1660,240 C 1760,300 1620,410 1520,320 Z" fill="url(#leaf-grad)" filter="url(#deep-blur)" />
      <!-- Subtle red chili silhouettes in corners (warm accents) -->
      <path d="M 130,860 C 200,740 340,790 320,920 C 300,1020 180,980 130,860 Z" fill="url(#chili-grad)" filter="url(#deep-blur)" />
      <path d="M 1740,200 C 1680,110 1790,70 1850,140 C 1910,210 1820,290 1740,200 Z" fill="url(#chili-grad)" filter="url(#deep-blur)" />
      <!-- Secondary organic lemon wedge shapes -->
      <ellipse cx="600" cy="180" rx="90" ry="140" transform="rotate(35 600 180)" fill="url(#lemon-grad)" filter="url(#deep-blur)" />
      <ellipse cx="1400" cy="890" rx="110" ry="160" transform="rotate(-25 1400 890)" fill="url(#lemon-grad)" filter="url(#deep-blur)" />
  </g>

  <!-- Center Product Halo Spotlight -->
  <rect width="1920" height="1080" fill="url(#center-highlight)" />

  <!-- Frosted Glass Matte Diffuse Veil -->
  
      <!-- Frosted matte glass layer -->
      <rect width="1920" height="1080" fill="#FAF6EE" opacity="0.48" />
      <radialGradient id="vignette-chili-lemon" cx="50%" cy="50%" r="70%">
        <stop offset="40%" stop-color="#000000" stop-opacity="0" />
        <stop offset="100%" stop-color="#DE392B" stop-opacity="0.08" />
      </radialGradient>
      <rect width="1920" height="1080" fill="url(#vignette-chili-lemon)" />
</svg>