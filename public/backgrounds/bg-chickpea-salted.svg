<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    
    <radialGradient id="bg-base-chickpea-salted" cx="50%" cy="45%" r="75%">
      <stop offset="0%" stop-color="#F6FBFB" />
      <stop offset="45%" stop-color="#E8F4F5" />
      <stop offset="80%" stop-color="#D5EBEF" />
      <stop offset="100%" stop-color="#BEDEE4" />
    </radialGradient>
    <linearGradient id="salt-blue-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#80DEEA" stop-opacity="0.65" />
      <stop offset="100%" stop-color="#4DD0E1" stop-opacity="0.35" />
    </linearGradient>
    <linearGradient id="pure-white-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#E0F7FA" stop-opacity="0.4" />
    </linearGradient>
    <filter id="soft-blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="35" result="blur" />
    </filter>
    <filter id="deep-blur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="65" result="deepBlur" />
    </filter>
    <filter id="gentle-blur" x="-15%" y="-15%" width="130%" height="130%">
      <feGaussianBlur stdDeviation="20" result="gentleBlur" />
    </filter>
    
    <radialGradient id="center-highlight" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.32" />
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="dark-center-highlight" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.15" />
      <stop offset="65%" stop-color="#ffffff" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Base Ambient Scene Fill -->
  <rect width="1920" height="1080" fill="url(#bg-base-chickpea-salted)" />

  <!-- Natural Ingredients Behind Glass Layer -->
  <g id="ingredient-elements">
    
      <!-- Pure sea salt crystals & gentle water ripples -->
      <polygon points="260,200 360,160 440,240 380,360 260,320" fill="url(#pure-white-grad)" filter="url(#deep-blur)" />
      <circle cx="340" cy="260" r="140" fill="url(#salt-blue-grad)" filter="url(#deep-blur)" />
      <polygon points="1600,680 1720,620 1800,720 1720,840 1580,800" fill="url(#pure-white-grad)" filter="url(#deep-blur)" />
      <circle cx="1660" cy="740" r="160" fill="url(#salt-blue-grad)" filter="url(#deep-blur)" />
      <!-- Soft diffused crystalline geometric forms -->
      <path d="M 180,620 C 300,520 440,640 380,780 C 300,920 120,800 180,620 Z" fill="url(#salt-blue-grad)" filter="url(#deep-blur)" />
      <path d="M 1740,260 C 1600,180 1760,80 1880,160 C 1960,260 1840,360 1740,260 Z" fill="url(#salt-blue-grad)" filter="url(#deep-blur)" />
      <circle cx="620" cy="180" r="90" fill="url(#pure-white-grad)" filter="url(#deep-blur)" />
      <circle cx="1360" cy="880" r="110" fill="url(#salt-blue-grad)" filter="url(#deep-blur)" />
  </g>

  <!-- Center Product Halo Spotlight -->
  <rect width="1920" height="1080" fill="url(#center-highlight)" />

  <!-- Frosted Glass Matte Diffuse Veil -->
  
      <rect width="1920" height="1080" fill="#F8FCFC" opacity="0.44" />
      <radialGradient id="vignette-salted" cx="50%" cy="50%" r="70%">
        <stop offset="40%" stop-color="#000000" stop-opacity="0" />
        <stop offset="100%" stop-color="#3A7D6E" stop-opacity="0.08" />
      </radialGradient>
      <rect width="1920" height="1080" fill="url(#vignette-salted)" />
</svg>