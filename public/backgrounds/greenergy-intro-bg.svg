<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="wall-sunlight" x1="0%" y1="0%" x2="100%" y2="75%">
      <stop offset="0%" stop-color="#FBF7EE" />
      <stop offset="38%" stop-color="#F5EDE0" />
      <stop offset="72%" stop-color="#EADDC9" />
      <stop offset="100%" stop-color="#DFCBB2" />
    </linearGradient>
    <linearGradient id="travertine-table" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E7D8C3" />
      <stop offset="35%" stop-color="#EFE4D4" />
      <stop offset="75%" stop-color="#E4D4BE" />
      <stop offset="100%" stop-color="#D6C2A7" />
    </linearGradient>
    <radialGradient id="morning-halo" cx="46%" cy="42%" r="60%">
      <stop offset="0%" stop-color="#FFFDF9" stop-opacity="0.78" />
      <stop offset="52%" stop-color="#FBF4E6" stop-opacity="0.36" />
      <stop offset="100%" stop-color="#E8D7BE" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="sun-beam" x1="15%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF8" stop-opacity="0.55" />
      <stop offset="50%" stop-color="#F9EFE0" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#D8C3A5" stop-opacity="0.22" />
    </linearGradient>
    <filter id="soft-bokeh" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="48" />
    </filter>
    <filter id="linen-soft" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="16" />
    </filter>
  </defs>

  <!-- Warm Plaster & Linen Upper Studio Backdrop -->
  <rect width="1920" height="1080" fill="url(#wall-sunlight)" />

  <!-- Soft Diagonal Morning Sunlight Ray -->
  <polygon points="0,0 1280,0 1920,820 520,1080 0,680" fill="url(#sun-beam)" filter="url(#soft-bokeh)" />

  <!-- Subtle Out-of-Focus Botanical Olive & Linen Bokeh in Upper Corners -->
  <g opacity="0.26" filter="url(#soft-bokeh)">
    <ellipse cx="210" cy="190" rx="190" ry="120" fill="#B5B89A" />
    <ellipse cx="1730" cy="220" rx="220" ry="140" fill="#C9BA9E" />
    <ellipse cx="140" cy="420" rx="150" ry="95" fill="#D5C5AC" />
  </g>

  <!-- Natural Travertine & Warm Linen Tabletop Surface (Horizon at y=670) -->
  <rect x="0" y="665" width="1920" height="415" fill="url(#travertine-table)" />
  <rect x="0" y="662" width="1920" height="14" fill="#D8C6AC" opacity="0.45" filter="url(#linen-soft)" />

  <!-- Soft Folded Natural Linen Drape Across Left/Right Tabletop -->
  <path d="M 0,710 Q 480,685 960,715 T 1920,700 L 1920,1080 L 0,1080 Z" fill="#F4ECE0" opacity="0.55" filter="url(#linen-soft)" />

  <!-- Central Editorial Studio Light Halo -->
  <rect width="1920" height="1080" fill="url(#morning-halo)" />
</svg>
